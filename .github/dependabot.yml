version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # clients/php gets its composer.json in slice P0. Until then Dependabot has
  # nothing to read in this directory.
  - package-ecosystem: composer
    directory: /clients/php
    schedule:
      interval: weekly
    groups:
      composer:
        patterns: ["*"]
