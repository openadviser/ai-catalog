name: PHP

on:
  pull_request:
    branches: [main]
    paths:
      - clients/php/**
      - .github/workflows/php.yml
  push:
    branches: [main]
    paths:
      - clients/php/**
      - .github/workflows/php.yml

permissions:
  contents: read

concurrency:
  group: php-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported PHP proves the dependency floor; the newest proves
          # the current set. The middle version runs the current set too.
          - php: "8.3"
            dependencies: lowest
          - php: "8.4"
            dependencies: highest
          - php: "8.5"
            dependencies: highest
    defaults:
      run:
        working-directory: clients/php
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install the lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - name: Install the highest dependencies
        if: matrix.dependencies == 'highest'
        run: composer update --prefer-stable --no-interaction --no-progress
      - name: Check
        run: composer check
