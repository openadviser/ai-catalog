name: New model or provider
description: Ask for a model or a provider to be added to the catalog.
title: "Add: "
labels: ["coverage"]
body:
  - type: markdown
    attributes:
      value: |
        The official provider page is the only source of truth for a price. Please link it.
  - type: input
    id: provider
    attributes:
      label: Provider
      description: Name the provider. For an existing one, say so.
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model id
      description: The provider's API model id. Leave empty if you are asking for a whole provider.
    validations:
      required: false
  - type: input
    id: pricing-url
    attributes:
      label: Official pricing page
      placeholder: https://
    validations:
      required: true
  - type: input
    id: models-url
    attributes:
      label: Model list or documentation page
      description: Where the provider lists its models and their capabilities, if there is one.
      placeholder: https://
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Anything unusual about the pricing
      description: Several tiers, dated rates, conditions on input size, units other than tokens.
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to write the reader or the entry myself.
